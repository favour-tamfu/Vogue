global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the Next.js app metrics endpoint
  - job_name: 'vogue-events'
    static_configs:
      - targets: ['vogue-events:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']